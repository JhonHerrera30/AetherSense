<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'New Device Notifications - ' + ${project.name}">Notifications</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:if="${project.id == 1}" th:href="@{/css/formNewDeviceLtrad.css}" />
    <link rel="stylesheet" th:if="${project.id == 51}" th:href="@{/css/formNewDeviceFire.css}" />
    <link rel="stylesheet" th:if="${project.id == 101}" th:href="@{/css/formNewDeviceVolcano.css}" />
</head>
<body>
<header id="navbar" class="navbar">
    <div class="nav-left">
        <h1><a th:if="${project.id == 1}" th:href="@{'/superadmin/manageProjectDevices/' + ${project.id}}" class="nav-title-link">L-TRAD</a></h1>
        <h1><a th:if="${project.id == 51}" th:href="@{'/superadmin/manageProjectDevices/' + ${project.id}}" class="nav-title-link">FIRE</a></h1>
        <h1><a th:if="${project.id == 101}" th:href="@{'/superadmin/manageProjectDevices/' + ${project.id}}" class="nav-title-link"> VOLCANO</a></h1>
    </div>
    <div class="nav-right">
        <div sec:authorize="isAuthenticated()" class="auth-user dropdown">
            <button type="button" class="dropdown-toggle" id="userDropdown" aria-haspopup="true" aria-expanded="false">
                Hi, <strong th:text="${user.visibleUsername}">utente</strong>
                <svg class="dropdown-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="white">
                    <path d="M7 10l5 5 5-5z" />
                </svg>
            </button>
            <div class="dropdown-menu" id="userDropdownMenu" role="menu" aria-labelledby="userDropdown">
                <a th:href="@{/personal-area}" class="dropdown-link" role="menuitem">Personal Area</a>
                <form th:action="@{/logout}" method="post" th:csrf="true">
                    <button type="submit" class="dropdown-logout" role="menuitem">Logout</button>
                </form>
            </div>
        </div>
        <a href="/" class="home-button" title="Homepage">
            <svg xmlns="http://www.w3.org/2000/svg" class="icon-home" viewBox="0 0 24 24">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
            </svg>
        </a>
    </div>
</header>
<section class="notifications-panel" aria-labelledby="notifications-title">
    <header class="notifications-header">
        <div class="notifications-header-text">
            <h2 id="notifications-title" class="notifications-title"
                th:text="'New device notifications'">New device notifications</h2>
            <p class="notifications-description">Live feed of devices waiting to be paired with the project.</p>
        </div>
        <div class="notifications-header-actions">
            <a th:href="@{'/superadmin/manageProjectDevices/' + ${project.id}}" class="btn-back" title="Back to Devices">Back to devices</a>
        </div>
    </header>
    <div class="notifications-content">
        <div id="notification-list" class="notifications-list" aria-live="polite" role="list"></div>
        <p id="notifications-empty" class="notifications-empty">No new devices detected at the moment.</p>
    </div>
</section>
<script th:inline="javascript">
/*<![CDATA[*/
    const projectId = [[${project.id}]];
/*]]>*/
    const container = document.getElementById('notification-list');
    const emptyState = document.getElementById('notifications-empty');
    const notifications = new Map();

    function updateEmptyState() {
        if (!emptyState || !container) {
            return;
        }
        emptyState.hidden = container.childElementCount > 0 ? true : false;
    }

    updateEmptyState();

    function formatMac(mac) {
        if (!mac) {
            return '';
        }
        const cleaned = mac.replace(/[^a-fA-F0-9]/g, '').toUpperCase();
        const pairs = cleaned.match(/.{1,2}/g);
        return pairs ? pairs.join(':') : '';
    }

    function renderNotification(n) {
        let box = document.getElementById('notif-' + n.key);
        const address = n.macAddress ? formatMac(n.macAddress) : formatMac(n.devEui);
        const details = n.devEui && n.macAddress ? `/${n.devEui}` : '';
        const identifierText = address ? `${address}${details}` : ((n.devEui && n.devEui.trim()) ? n.devEui : 'Identificativo non disponibile');
        const typeLabel = n.typeOfDevice && n.typeOfDevice.trim() ? n.typeOfDevice : 'Tipologia non specificata';
        if (!box) {
            box = document.createElement('div');
            box.id = 'notif-' + n.key;
            box.className = 'notification-box';
            box.setAttribute('role', 'listitem');
            box.innerHTML = `<div class="notification-icon" aria-hidden="true">📡</div>
                             <div class="notification-main">
                                 <p class="device-identifiers"><strong class="device-address">${identifierText}</strong>
                                     <span class="device-type">${typeLabel}</span></p>
                                 <p class="time"></p>
                             </div>
                             <div class="notification-actions">
                                 <button type="button" class="btn-add" onclick="addDevice('${n.key}')">Add device</button>
                             </div>`;
            container.appendChild(box);
        }
        const addressElement = box.querySelector('.device-address');
        if (addressElement) {
            addressElement.textContent = identifierText;
        }
        const typeElement = box.querySelector('.device-type');
        if (typeElement) {
            typeElement.textContent = typeLabel;
        }
        const parsedTimestamp = Date.parse(n.timestamp);
        box.dataset.timestamp = isNaN(parsedTimestamp) ? Date.now() : parsedTimestamp;
        updateEmptyState();
        updateTimes();
    }

    function updateTimes() {
        const now = Date.now();
        document.querySelectorAll('.notification-box').forEach(box => {
            const ts = parseInt(box.dataset.timestamp, 10);
            const timeElement = box.querySelector('.time');
            if (!timeElement || Number.isNaN(ts)) {
                return;
            }
            const diffSeconds = Math.max(0, Math.floor((now - ts) / 1000));
            let label;
            if (diffSeconds < 5) {
                label = 'Just now';
            } else if (diffSeconds < 60) {
                label = diffSeconds + 's ago';
            } else if (diffSeconds < 3600) {
                const minutes = Math.floor(diffSeconds / 60);
                label = minutes === 1 ? '1 minute ago' : minutes + ' minutes ago';
            } else {
                const hours = Math.floor(diffSeconds / 3600);
                label = hours === 1 ? '1 hour ago' : hours + ' hours ago';
            }
            timeElement.textContent = label;
            const preciseDate = new Date(ts);
            if (!Number.isNaN(preciseDate.getTime())) {
                timeElement.setAttribute('title', preciseDate.toLocaleString());
            }
        });
    }
    setInterval(updateTimes, 1000);

    function addDevice(key) {
        fetch(`/api/notifications/${projectId}/${encodeURIComponent(key)}/add`, {method:'POST'})
            .then(response => {
                if (response.ok) {
                    window.location.href = `/superadmin/manageProjectDevices/${projectId}`;
                } else if (response.status === 404) {
                    alert('Notification not found');
                } else if (response.status === 409) {
                    alert('Device already exists');
                } else {
                    alert('Error adding device');
                }
            })
            .catch(() => alert('Error connecting to server'));
    }

    const evtSource = new EventSource(`/api/notifications/stream/${projectId}`);
    evtSource.addEventListener('unknown-device', e => {
        const data = JSON.parse(e.data);
        notifications.set(data.key, data);
        renderNotification(data);
    });
</script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const toggle = document.getElementById("userDropdown");
        const menu = document.getElementById("userDropdownMenu");

        if (!toggle || !menu) {
            return;
        }

        toggle.addEventListener("click", function (event) {
            event.stopPropagation();
            const isExpanded = toggle.getAttribute("aria-expanded") === "true";
            toggle.setAttribute("aria-expanded", (!isExpanded).toString());
            menu.classList.toggle("show");
        });

        document.addEventListener("click", function (event) {
            if (!menu.contains(event.target) && event.target !== toggle) {
                menu.classList.remove("show");
                toggle.setAttribute("aria-expanded", "false");
            }
        });
    });
</script>
</body>
</html>
