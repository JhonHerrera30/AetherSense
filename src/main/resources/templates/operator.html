<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<title th:text="${project.name} + ' – Operator Map'">Operator Map</title>
	<link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />

	<!-- CSS per LTRAD -->
	<link rel="stylesheet" th:if="${project.id == 1}" th:href="@{/css/ltradOperator.css}" />
	<!-- CSS per FIRE -->
	<link rel="stylesheet" th:if="${project.id == 51}" th:href="@{/css/fireOperator.css}" />
	<!-- CSS per VOLCANO -->
        <link rel="stylesheet" th:if="${project.id == 101}" th:href="@{/css/volcanoOperator.css}" />

        <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}" />
        <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}" />

        <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
</head>

<body>
	<header id="navbar" class="navbar">
		<div class="nav-left">
			<h1>
				<a th:href="@{'/success'(projectId=${project.id})}" class="nav-title-link"
					th:text="${project.name}">PROJECT</a>
			</h1>
		</div>
		<div class="nav-right">
                        <div sec:authorize="isAuthenticated()" class="auth-user dropdown">
                                <button type="button" class="dropdown-toggle" id="userDropdown" aria-haspopup="true" aria-expanded="false">
                                        Hi, <strong th:text="${user.visibleUsername}">utente</strong>
                                        <svg class="dropdown-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16"
                                                height="16" fill="white">
                                                <path d="M7 10l5 5 5-5z" />
                                        </svg>
                                </button>
                                <div class="dropdown-menu" id="userDropdownMenu" role="menu" aria-labelledby="userDropdown">
                                        <a th:href="@{/personal-area}" class="dropdown-link" role="menuitem">Personal Area</a>
                                        <form th:action="@{/logout}" method="post" th:csrf="true">
                                                <button type="submit" class="dropdown-logout" role="menuitem">Logout</button>
                                        </form>
                                </div>
                        </div>
			<!--a href="/" class="home-button" title="Homepage"-->
			<form th:action="@{/logout}" method="post" th:csrf="true">
				<button type="submit" class="home-button" title="Logout and back to home">
					<svg xmlns="http://www.w3.org/2000/svg" class="icon-home" viewBox="0 0 24 24">
						<path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
					</svg>
				</button>
			</form>
			<!--/a-->
		</div>
	</header>  
      <div class="main-layout">
		<!-- Colonna sinistra -->
                <div class="group-panel">
					  <h1 class="page-title" th:text="${project.name} + ' – Operator Dashboard'">Operator Dashboard</h1>
                        <div class="title-with-search">
                                <h2 class="section-title">Activation Requests</h2>
                        </div>
                        <div id="activation-requests-wrapper" class="activation-requests-wrapper">
                                <a th:href="@{'/operator/' + ${project.id} + '/activations'}" class="activation-requests-link">
                                        <span class="activation-requests-icon" aria-hidden="true">⚡</span>
                                        <span>Open activation requests</span>
                                </a>
                        </div>

                        <div class="title-with-search">
                                <h2>Your Devices on Map</h2>
                                <form th:action="@{'/operator/' + ${project.id}}" method="get" class="search-form">
                                        <input type="text" name="deviceInfo"
                                                th:attr="placeholder=${project.id == 101} ? 'Search by name or MAC...' : 'Search by name or DevEUI...'"
                                                th:value="${param.deviceInfo}" />
					<button type="submit" title="Search">
						<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="white" viewBox="0 0 24 24">
							<circle cx="11" cy="11" r="8" stroke="white" stroke-width="2" fill="none" />
							<line x1="17" y1="17" x2="22" y2="22" stroke="white" stroke-width="2" />
						</svg>
					</button>
				</form>
			</div>

                        <div id="user-devices-wrapper">
                                <div th:if="${devices.isEmpty()}" id="user-devices-empty">No positioned devices</div>
                                <table>
                                        <thead>
                                                <tr>
                                                        <th scope="col">Name</th>
                                                        <th scope="col"
                                                                th:text="${project.id == 101} ? 'MAC Address' : 'DevEUI'">
                                                                Identifier
                                                        </th>
                                                        <th scope="col">Type</th>
                                                </tr>
                                        </thead>
                                        <tbody>
                                                <tr th:each="device : ${devices}">
                                                        <td th:text="${device.name}">Name</td>
                                                        <td
                                                                th:text="${T(it.sensorplatform.util.MacAddressUtils).formatIdentifierForProject(project.id, device.macAddress, device.devEui)}">
                                                                Identifier
                                                        </td>
                                                        <td th:text="${device.tod}">Type</td>
                                                </tr>
                                        </tbody>
                                </table>
			</div>
		</div>

		<!-- Mappa -->
		<div id="map"></div>
	</div>

	
<script th:inline="javascript">
        /*<![CDATA[*/
        const initialDevices = [[${devices}]];
        /*]]>*/

        const map = L.map('map').setView([41.89, 12.48], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const markerByKey = new Map();

        function formatMac(mac) {
                if (!mac) {
                        return '';
                }
                const cleaned = mac.replace(/[^a-fA-F0-9]/g, '').toUpperCase();
                const pairs = cleaned.match(/.{1,2}/g);
                return pairs ? pairs.join(':') : '';
        }

        function resolveDeviceKey(device) {
                if (!device) {
                        return null;
                }
                if (device.macAddress) {
                        return device.macAddress.toUpperCase();
                }
                if (device.devEui) {
                        return device.devEui.toUpperCase();
                }
                if (device.deviceId) {
                        return `DEVICE-${device.deviceId}`;
                }
                if (device.id) {
                        return `DEVICE-${device.id}`;
                }
                return null;
        }

        function buildPopupContent(device) {
                const name = device.name || 'Device';
                const mac = formatMac(device.macAddress);
                const lat = device.latitude != null ? device.latitude : 'n/a';
                const lon = device.longitude != null ? device.longitude : 'n/a';
                return `Device: ${name}<br>MacAddress: ${mac}<br>Latitude: ${lat}<br>Longitude: ${lon}`;
        }

        function addOrUpdateDeviceMarker(device) {
                if (!device || device.latitude == null || device.longitude == null) {
                        return;
                }
                const key = resolveDeviceKey(device);
                if (!key) {
                        return;
                }
                const latlng = [device.latitude, device.longitude];
                let marker = markerByKey.get(key);
                if (!marker) {
                        marker = L.marker(latlng).addTo(map);
                        marker.on('mouseover', function () { this.openPopup(); });
                        marker.on('mouseout', function () { this.closePopup(); });
                        markerByKey.set(key, marker);
                } else {
                        marker.setLatLng(latlng);
                }
                marker.bindPopup(buildPopupContent(device));
        }

        function recalculateBounds() {
                const latLngs = Array.from(markerByKey.values()).map(marker => marker.getLatLng());
                if (latLngs.length > 0) {
                        const bounds = L.latLngBounds(latLngs);
                        map.fitBounds(bounds, {padding: [30, 30]});
                }
        }

        initialDevices.forEach(addOrUpdateDeviceMarker);
        recalculateBounds();

</script>


        <script>
                document.addEventListener("DOMContentLoaded", function () {
                        const toggle = document.getElementById("userDropdown");
                        const menu = document.getElementById("userDropdownMenu");

                        if (!toggle || !menu) {
                                return;
                        }

                        toggle.addEventListener("click", function (event) {
                                event.stopPropagation();
                                const isExpanded = toggle.getAttribute("aria-expanded") === "true";
                                toggle.setAttribute("aria-expanded", (!isExpanded).toString());
                                menu.classList.toggle("show");
                        });

                        document.addEventListener("click", function (event) {
                                if (!menu.contains(event.target) && event.target !== toggle) {
                                        menu.classList.remove("show");
                                        toggle.setAttribute("aria-expanded", "false");
                                }
                        });
                });
        </script>

</body>

</html>
