<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Factor Authentication – AetherSense</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/personalArea.css}">
</head>

<body class="personal-area theme-superadmin">
    <header id="navbar" class="navbar">
        <div class="nav-left">
            <h1>AetherSense</h1>
        </div>
    </header>

    <main class="personal-area-content">
        <section class="forms-grid">
            <article class="card">
                <header class="card-header">
                    <h2>Two-Factor Authentication</h2>
                    <p>Enter the 6-digit code from your authenticator app to complete login.</p>
                </header>

                <div th:if="${session['2fa_error']}" class="alert error" th:text="${session['2fa_error']}"></div>

                <form th:action="@{/2fa/verify}" method="post" th:csrf="true" class="form">
                    <input type="hidden" name="projectId" th:value="${projectId}" />

                    <div class="form-group">
                        <label for="code">Verification code</label>
                        <input type="text" id="code" name="code" maxlength="6" inputmode="numeric" pattern="[0-9]{6}"
                            placeholder="000000" autocomplete="one-time-code" autofocus />
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="primary-button">Verify</button>
                        <a th:href="@{/logout}" class="secondary-button" style="margin-left: 1rem;">Cancel</a>
                    </div>
                </form>
            </article>
        </section>
    </main>
</body>

</html>
